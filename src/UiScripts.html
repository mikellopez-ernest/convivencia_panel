<script>
      const state = {
        picker: null,
        historicPicker: null,
        tuesdayPicker: null,
        importModal: null,
        studentDetailModal: null,
        studyGroupModal: null,
        thirdProjectModal: null,
        expulsionModal: null,
        studentDetailIncidents: [],
        restorativeMeasures: [],
        editedRows: {},
        rowControls: {},
        savedRows: {},
        historicRecords: [],
        tuesdayComments: {},
        thirdProjectOutcomes: {},
        expulsionRecords: [],
        expulsionSearchTimer: null,
        pageLoaded: {},
        activeSpecialRow: null,
        thirdProjectSelectedDates: [],
        saveQueue: [],
        isSaving: false,
        specialFlowPending: false,
        pendingImport: null,
        lastPayloadStatus: '',
        currentDate: '',
        currentPage: 'home'
      };

      const Api = {
        call(name, args = [], options = {}) {
          const busy = options.busy !== false;
          const button = options.button || null;

          if (busy) {
            setLoading(true);
          }

          if (button) {
            button.disabled = true;
          }

          return new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler((payload) => {
                if (busy) {
                  setLoading(false);
                }

                if (button) {
                  button.disabled = false;
                }

                resolve(payload);
              })
              .withFailureHandler((error) => {
                if (busy) {
                  setLoading(false);
                }

                if (button) {
                  button.disabled = false;
                }

                reject(error);
              })[name](...args);
          });
        }
      };

      document.addEventListener('DOMContentLoaded', () => {
        state.importModal = new bootstrap.Modal(document.getElementById('importModal'));
        state.studentDetailModal = new bootstrap.Modal(document.getElementById('studentDetailModal'));
        state.studyGroupModal = new bootstrap.Modal(document.getElementById('studyGroupModal'));
        state.thirdProjectModal = new bootstrap.Modal(document.getElementById('thirdProjectModal'));
        state.expulsionModal = new bootstrap.Modal(document.getElementById('expulsionModal'));
        state.picker = flatpickr('#selectedDate', {
          dateFormat: 'd/m/Y',
          locale: flatpickr.l10ns.es,
          defaultDate: new Date(),
          disableMobile: false,
          onChange: (_selectedDates, dateStr) => handleDateChange(dateStr)
        });
        state.historicPicker = flatpickr('#historicDate', {
          dateFormat: 'd/m/Y',
          locale: flatpickr.l10ns.es,
          allowInput: true,
          onChange: renderHistoricRows
        });
        state.tuesdayPicker = flatpickr('#tuesdayDate', {
          dateFormat: 'd/m/Y',
          locale: flatpickr.l10ns.es,
          disableMobile: false,
          onChange: (_selectedDates, dateStr) => loadTuesdaySessions(dateStr)
        });
        flatpickr('.expulsion-date', {
          dateFormat: 'd/m/Y',
          locale: flatpickr.l10ns.es,
          disableMobile: false
        });

        document.getElementById('adminFab').addEventListener('click', toggleAdminMenu);
        document.getElementById('saveFab').addEventListener('click', handleSaveButton);
        document.getElementById('uploadImportButton').addEventListener('click', chooseXlsxFile);
        document.getElementById('apiImportButton').addEventListener('click', previewApiImport);
        document.getElementById('xlsxInput').addEventListener('change', previewUploadedImport);
        document.getElementById('confirmImportButton').addEventListener('click', confirmImport);
        document.getElementById('activityFilter').addEventListener('change', renderFilteredStudentDetailRows);
        document.getElementById('teacherFilter').addEventListener('change', renderFilteredStudentDetailRows);
        document.getElementById('historicGroup').addEventListener('change', renderHistoricRows);
        document.getElementById('historicStudent').addEventListener('input', renderHistoricRows);
        document.getElementById('expulsionSearch').addEventListener('input', handleExpulsionSearchInput);
        document.getElementById('studyGroupCount').addEventListener('input', renderStudyGroupDateInputs);
        document.getElementById('saveStudyGroupButton').addEventListener('click', saveStudyGroupFromModal);
        document.getElementById('saveThirdProjectButton').addEventListener('click', saveThirdProjectFromModal);
        document.getElementById('saveExpulsionButton').addEventListener('click', saveExpulsionFromModal);
        ['studyGroupModal', 'thirdProjectModal', 'expulsionModal'].forEach((id) => {
          document.getElementById(id).addEventListener('hidden.bs.modal', handleSpecialModalHidden);
        });
        document.querySelectorAll('.placeholder-link').forEach((link) => {
          link.addEventListener('click', (event) => event.preventDefault());
        });
        document.querySelectorAll('.page-link').forEach((link) => {
          link.addEventListener('click', (event) => {
            event.preventDefault();
            showPage(link.dataset.page);
          });
        });

        loadPayload();
      });

      function loadPayload(dateText) {
        Api.call('getIncidentPointsPayload', [dateText || ''])
          .then(renderPayload)
          .catch(renderError);
      }

      function showPage(page) {
        state.currentPage = page || 'home';
        document.querySelectorAll('.page-section').forEach((section) => section.classList.add('d-none'));
        document.querySelectorAll('.page-link').forEach((link) => {
          const active = link.dataset.page === state.currentPage;
          link.classList.toggle('active', active);
          link.toggleAttribute('aria-current', active);
        });

        if (state.currentPage === 'historic') {
          document.getElementById('historicPage').classList.remove('d-none');
          if (!state.pageLoaded.historic) {
            loadHistoricRec();
          }
          showAdminTools(false);
          return;
        }

        if (state.currentPage === 'tuesday') {
          document.getElementById('tuesdayPage').classList.remove('d-none');
          loadTuesdaySessions();
          showAdminTools(true);
          return;
        }

        if (state.currentPage === 'third') {
          document.getElementById('thirdPage').classList.remove('d-none');
          if (!state.pageLoaded.third) {
            loadThirdProjectMonth();
          }
          showAdminTools(true);
          return;
        }

        if (state.currentPage === 'expulsions') {
          document.getElementById('expulsionsPage').classList.remove('d-none');
          if (!state.pageLoaded.expulsions) {
            loadExpulsions();
          }
          showAdminTools(false);
          return;
        }

        document.getElementById('homePage').classList.remove('d-none');
        showAdminTools(state.lastPayloadStatus !== 'unauthorized');
      }

      function loadHistoricRec() {
        Api.call('getHistoricRecPayload')
          .then(renderHistoricPayload)
          .catch((error) => showAlert(error.message || String(error), 'danger'));
      }

      function renderHistoricPayload(payload) {
        if (!payload || !payload.ok) {
          showAlert(payload && payload.message ? payload.message : 'Error desconegut.', 'danger');
          return;
        }

        state.historicRecords = payload.records || [];
        state.pageLoaded.historic = true;
        populateSelect(document.getElementById('historicGroup'), payload.groups || [], 'Tots');
        renderHistoricRows();
      }

      function renderHistoricRows() {
        const tbody = document.getElementById('historicRows');
        const empty = document.getElementById('historicEmpty');
        const date = document.getElementById('historicDate').value;
        const group = document.getElementById('historicGroup').value;
        const student = normalizeText(document.getElementById('historicStudent').value);
        const rows = state.historicRecords.filter((record) => {
          return (!date || record.data === date)
            && (!group || record.grup === group)
            && (!student || normalizeText(record.alumne).includes(student));
        });

        tbody.innerHTML = '';
        empty.classList.toggle('d-none', rows.length > 0);
        empty.textContent = state.historicRecords.length ? 'No hi ha registres amb aquests filtres.' : 'No hi ha registres REC.';

        rows.forEach((record) => {
          const tr = document.createElement('tr');
          appendTextCell(tr, record.data);
          appendTextCell(tr, record.alumne);
          appendTextCell(tr, record.grup);
          appendTextCell(tr, formatPoints(record.punts), 'text-end points-cell');
          appendTextCell(tr, record.comentari, 'student-detail-note');
          appendTextCell(tr, record.mesura);
          tbody.appendChild(tr);
        });
      }

      function loadTuesdaySessions(dateText) {
        Api.call('getTuesdaySessionsPayload', [dateText || ''])
          .then(renderTuesdayPayload)
          .catch((error) => showAlert(error.message || String(error), 'danger'));
      }

      function renderTuesdayPayload(payload) {
        if (!payload || !payload.ok) {
          showAlert(payload && payload.message ? payload.message : 'Error desconegut.', 'danger');
          return;
        }

        if (payload.selectedDate && state.tuesdayPicker) {
          state.tuesdayPicker.setDate(payload.selectedDate, false, 'd/m/Y');
        }

        state.tuesdayComments = {};
        document.getElementById('tuesdayTeachers').textContent = (payload.teachers || []).join('\n') || 'No hi ha professorat assignat.';
        renderTuesdayRows(payload.students || []);
      }

      function renderTuesdayRows(rows) {
        const tbody = document.getElementById('tuesdayRows');
        const empty = document.getElementById('tuesdayEmpty');
        tbody.innerHTML = '';
        empty.classList.toggle('d-none', rows.length > 0);
        empty.textContent = 'No hi ha alumnat assignat a aquesta sessió.';

        rows.forEach((row) => {
          const tr = document.createElement('tr');
          const input = document.createElement('input');

          input.className = 'form-control form-control-sm comment-input';
          input.value = row.comment || '';
          input.addEventListener('input', () => {
            state.tuesdayComments[row.id] = input.value;
            tr.classList.add('editable-row');
            syncSaveButtonState();
          });

          appendTextCell(tr, row.id);
          appendTextCell(tr, row.date);
          appendTextCell(tr, row.student);
          const cell = document.createElement('td');
          cell.appendChild(input);
          tr.appendChild(cell);
          tbody.appendChild(tr);
        });

        syncSaveButtonState();
      }

      function loadThirdProjectMonth() {
        Api.call('getThirdProjectMonthPayload', [''])
          .then(renderThirdProjectMonth)
          .catch((error) => showAlert(error.message || String(error), 'danger'));
      }

      function renderThirdProjectMonth(payload) {
        if (!payload || !payload.ok) {
          showAlert(payload && payload.message ? payload.message : 'Error desconegut.', 'danger');
          return;
        }

        state.thirdProjectOutcomes = {};
        state.pageLoaded.third = true;
        document.getElementById('thirdMonthLabel').textContent = payload.monthLabel ? `Calendari ${payload.monthLabel}` : 'Calendari mensual.';

        const tbody = document.getElementById('thirdMonthRows');
        const empty = document.getElementById('thirdEmpty');
        const options = payload.outcomeOptions || [];
        let assignmentCount = 0;
        tbody.innerHTML = '';

        (payload.weeks || []).forEach((week) => {
          const tr = document.createElement('tr');

          week.forEach((cell) => {
            const td = document.createElement('td');
            td.className = 'calendar-cell';
            td.classList.toggle('calendar-cell-muted', !cell.inMonth || cell.weekend);

            const date = document.createElement('div');
            date.className = 'fw-semibold';
            date.textContent = cell.inMonth ? cell.date : '';
            td.appendChild(date);

            if (cell.inMonth && !cell.weekend) {
              const teacher = document.createElement('div');
              teacher.className = 'small text-secondary';
              teacher.textContent = cell.teacher || 'Sense professor';
              td.appendChild(teacher);

              (cell.assignments || []).forEach((assignment) => {
                assignmentCount += 1;
                const block = document.createElement('div');
                const name = document.createElement('div');
                const select = document.createElement('select');

                block.className = 'calendar-assignment';
                name.className = 'small mb-1';
                name.textContent = assignment.student || '(sense alumne)';
                select.className = 'form-select form-select-sm';
                populateSelect(select, options, '');
                select.value = assignment.aprofitament || '';
                select.addEventListener('change', () => {
                  state.thirdProjectOutcomes[assignment.id] = {
                    id: assignment.id,
                    aprofitament: select.value
                  };
                  block.classList.add('selected-cell');
                  syncSaveButtonState();
                });

                block.appendChild(name);
                block.appendChild(select);
                td.appendChild(block);
              });
            }

            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });

        empty.classList.toggle('d-none', assignmentCount > 0);
        empty.textContent = 'No hi ha assignacions 3R en aquest mes.';
        syncSaveButtonState();
      }

      function loadExpulsions(query) {
        Api.call('getExpulsionsPayload', [query || ''])
          .then(renderExpulsionsPayload)
          .catch((error) => showAlert(error.message || String(error), 'danger'));
      }

      function handleExpulsionSearchInput() {
        window.clearTimeout(state.expulsionSearchTimer);
        state.expulsionSearchTimer = window.setTimeout(() => {
          loadExpulsions(document.getElementById('expulsionSearch').value);
        }, 250);
      }

      function renderExpulsionsPayload(payload) {
        if (!payload || !payload.ok) {
          showAlert(payload && payload.message ? payload.message : 'Error desconegut.', 'danger');
          return;
        }

        const datalist = document.getElementById('expulsionSuggestions');
        datalist.innerHTML = '';
        (payload.suggestions || []).forEach((student) => {
          const option = document.createElement('option');
          option.value = student;
          datalist.appendChild(option);
        });

        state.expulsionRecords = payload.records || [];
        state.pageLoaded.expulsions = true;
        renderExpulsionsRows(state.expulsionRecords);
      }

      function renderExpulsionsRows(rows) {
        const tbody = document.getElementById('expulsionsRows');
        const empty = document.getElementById('expulsionsEmpty');
        tbody.innerHTML = '';
        empty.classList.toggle('d-none', rows.length > 0);
        empty.textContent = document.getElementById('expulsionSearch').value
          ? 'No hi ha expulsions per a aquest filtre.'
          : 'No hi ha expulsions registrades.';

        rows.forEach((record) => {
          const tr = document.createElement('tr');
          appendTextCell(tr, record.id);
          appendTextCell(tr, record.date);
          appendTextCell(tr, record.student);
          appendTextCell(tr, record.className);
          appendTextCell(tr, record.startDate);
          appendTextCell(tr, record.returnDate);
          appendTextCell(tr, record.incident, 'student-detail-note');

          const documentCell = document.createElement('td');
          if (record.document) {
            const link = document.createElement('a');
            link.href = record.document;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = 'Document';
            documentCell.appendChild(link);
          } else {
            documentCell.textContent = '-';
          }
          tr.appendChild(documentCell);
          tbody.appendChild(tr);
        });
      }

      function handleDateChange(dateText) {
        if (hasUnsavedRows()) {
          const proceed = window.confirm('Hi ha registres pendents de desar. Vols descartar aquests canvis?');

          if (!proceed) {
            if (state.currentDate && state.picker) {
              state.picker.setDate(state.currentDate, false, 'd/m/Y');
            }

            return;
          }
        }

        clearMeetingEditState();
        loadPayload(dateText);
      }

      function renderPayload(payload) {
        setLoading(false);

        if (!payload || !payload.ok) {
          renderError(payload && payload.message ? payload.message : 'Error desconegut.');
          return;
        }

        if (payload.selectedDate && state.picker) {
          state.picker.setDate(payload.selectedDate, false, 'd/m/Y');
          state.currentDate = payload.selectedDate;
        }

        if (payload.status === 'unauthorized') {
          state.lastPayloadStatus = payload.status;
          showAlert(payload.message, 'warning');
          showControls(false);
          showAdminTools(false);
          renderRows([]);
          renderIssues([]);
          return;
        }

        state.lastPayloadStatus = payload.status;
        state.restorativeMeasures = payload.restorativeMeasures || [];
        clearMeetingEditState();
        showControls(true);
        showAdminTools(true);

        if (payload.status === 'out_of_period' || payload.status === 'empty') {
          showAlert(payload.message, payload.status === 'empty' ? 'info' : 'warning');
          renderRows([]);
        } else {
          hideAlert();
          renderRows(payload.rows || []);
        }

        renderTerm(payload.term);
        renderIssues(payload.issues || []);
      }

      function renderRows(rows) {
        const tbody = document.getElementById('rows');
        const tableSection = document.getElementById('tableSection');
        tbody.innerHTML = '';

        if (!rows.length) {
          tableSection.classList.add('d-none');
          return;
        }

        tableSection.classList.remove('d-none');

        rows.forEach((row) => {
          const tr = document.createElement('tr');
          const statusCell = document.createElement('td');
          const studentCell = document.createElement('td');
          const groupCell = document.createElement('td');
          const pointsCell = document.createElement('td');
          const commentCell = document.createElement('td');
          const measureCell = document.createElement('td');
          const studentButton = document.createElement('button');
          const commentInput = document.createElement('input');
          const measureSelect = document.createElement('select');
          const savedRecord = row.savedRecord || null;

          statusCell.className = 'status-cell';
          studentButton.type = 'button';
          studentButton.className = 'student-button';
          studentButton.textContent = row.alumne || '(sense nom)';
          studentButton.title = 'Veure incidències';
          studentButton.addEventListener('click', () => openStudentDetail(row));

          commentInput.type = 'text';
          commentInput.className = 'form-control form-control-sm comment-input';
          commentInput.dataset.field = 'comentari';
          commentInput.setAttribute('aria-label', `Comentari de ${row.alumne || 'alumne'}`);
          commentInput.addEventListener('input', () => updateMeetingEditState(row, tr, statusCell, commentInput, measureSelect));

          measureSelect.className = 'form-select form-select-sm measure-select';
          measureSelect.dataset.field = 'mesura';
          measureSelect.setAttribute('aria-label', `Mesura de ${row.alumne || 'alumne'}`);
          populateSelect(measureSelect, state.restorativeMeasures, '');
          measureSelect.addEventListener('change', () => updateMeetingEditState(row, tr, statusCell, commentInput, measureSelect));

          if (savedRecord) {
            commentInput.value = savedRecord.comentari || '';
            measureSelect.value = savedRecord.mesura || '';
            renderSavedStatus(row, statusCell);
          }

          studentCell.appendChild(studentButton);
          groupCell.textContent = row.grup || 'Sense grup';
          pointsCell.className = 'text-end points-cell';
          pointsCell.textContent = formatPoints(row.punts);
          commentCell.appendChild(commentInput);
          measureCell.appendChild(measureSelect);

          tr.appendChild(statusCell);
          tr.appendChild(studentCell);
          tr.appendChild(groupCell);
          tr.appendChild(pointsCell);
          tr.appendChild(commentCell);
          tr.appendChild(measureCell);
          tbody.appendChild(tr);
          state.rowControls[row.id] = { tr, statusCell, commentInput, measureSelect, row };
        });

        syncSaveButtonState();
      }

      function updateMeetingEditState(row, tr, statusCell, commentInput, measureSelect) {
        const comment = commentInput.value.trim();
        const measure = measureSelect.value.trim();
        const isEdited = Boolean(comment || measure);

        tr.classList.toggle('editable-row', isEdited);
        statusCell.innerHTML = '';

        if (isEdited) {
          state.editedRows[row.id] = {
            id: row.id,
            alumne: row.alumne || '',
            grup: row.grup || '',
            punts: row.punts,
            comentari: comment,
            mesura: measure
          };
          delete state.savedRows[row.id];
        } else {
          delete state.editedRows[row.id];
          delete state.savedRows[row.id];
        }

        syncSaveButtonState();
      }

      function renderSavedStatus(row, statusCell) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'saved-clear-button';
        button.title = 'Esborrar registre desat';
        button.setAttribute('aria-label', 'Esborrar registre desat');
        button.innerHTML = [
          '<i class="bi bi-check-circle-fill saved-check check-icon" aria-hidden="true"></i>',
          '<i class="bi bi-ban clear-icon" aria-hidden="true"></i>'
        ].join('');
        button.addEventListener('click', () => clearSavedMeetingRecord(row));
        statusCell.innerHTML = '';
        statusCell.appendChild(button);
      }

      function clearSavedMeetingRecord(row) {
        const controls = state.rowControls[row.id];

        if (!controls) {
          return;
        }

        setLoading(true);
        google.script.run
          .withSuccessHandler((payload) => {
            setLoading(false);

            if (!payload || !payload.ok) {
              showAlert(payload && payload.message ? payload.message : 'No s’ha pogut esborrar el registre.', 'danger');
              return;
            }

            controls.commentInput.value = '';
            controls.measureSelect.value = '';
            controls.tr.classList.remove('editable-row');
            controls.statusCell.innerHTML = '';
            delete state.editedRows[row.id];
            delete state.savedRows[row.id];
            showAlert(payload.message || 'Registre esborrat correctament.', 'success');
            syncSaveButtonState();
          })
          .withFailureHandler((error) => {
            setLoading(false);
            showAlert(error.message || String(error), 'danger');
          })
          .deleteLatestMeetingRecord(row.id, document.getElementById('selectedDate').value);
      }

      function handleSaveButton() {
        if (state.currentPage === 'tuesday') {
          saveTuesdayComments();
          return;
        }

        if (state.currentPage === 'third') {
          saveThirdProjectOutcomes();
          return;
        }

        saveEditedMeetingRecords();
      }

      function saveEditedMeetingRecords() {
        const records = Object.keys(state.editedRows).map((id) => state.editedRows[id]);

        if (!records.length) {
          showAlert('No hi ha registres pendents de desar.', 'info');
          return;
        }

        const simpleRecords = records.filter((record) => !isSpecialMeasure(record.mesura));
        const specialRecords = records.filter((record) => isSpecialMeasure(record.mesura));

        setSaving(true);

        if (simpleRecords.length) {
          Api.call('saveMeetingRecords', [simpleRecords, document.getElementById('selectedDate').value], {
            busy: true
          })
            .then((payload) => {
              if (!payload || !payload.ok) {
                renderMeetingSaveFailure(payload || 'Error desconegut.');
                return;
              }

              simpleRecords.forEach((record) => markSingleRowAsSaved(record.id));
              state.saveQueue = specialRecords;
              processNextMeetingRecord();
            })
            .catch(renderMeetingSaveFailure);
          return;
        }

        state.saveQueue = specialRecords;
        processNextMeetingRecord();
      }

      function isSpecialMeasure(measure) {
        return ['Dimarts tarda', 'Equip 3R', 'Expulsió'].includes(String(measure || '').trim());
      }

      function processNextMeetingRecord() {
        const record = state.saveQueue.shift();

        if (!record) {
          setSaving(false);
          setLoading(false);
          showAlert('Registres desats correctament.', 'success');
          syncSaveButtonState();
          return;
        }

        setLoading(true);
        google.script.run
          .withSuccessHandler((payload) => {
            setLoading(false);
            if (!payload || !payload.ok) {
              renderMeetingSaveFailure(payload || 'Error desconegut.');
              return;
            }

            markSingleRowAsSaved(record.id);
            handleSpecialMeasure(record);
          })
          .withFailureHandler(renderMeetingSaveFailure)
          .saveSingleMeetingRecord(record, document.getElementById('selectedDate').value);
      }

      function handleSpecialMeasure(record) {
        if (record.mesura === 'Dimarts tarda') {
          openStudyGroupModal(record);
          return;
        }

        if (record.mesura === 'Equip 3R') {
          openThirdProjectModal(record);
          return;
        }

        if (record.mesura === 'Expulsió') {
          openExpulsionModal(record);
          return;
        }

        processNextMeetingRecord();
      }

      function renderMeetingSaveResult(payload) {
        setSaving(false);

        if (!payload || !payload.ok) {
          renderMeetingSaveFailure(payload || 'Error desconegut.');
          return;
        }

        if (payload.status === 'empty') {
          showAlert(payload.message, 'info');
          return;
        }

        if (payload.status === 'unauthorized') {
          showAlert(payload.message, 'warning');
          return;
        }

        markEditedRowsAsSaved();
        showAlert(`${payload.message} (${payload.savedCount || 0})`, 'success');
      }

      function renderMeetingSaveFailure(error) {
        setLoading(false);
        setSaving(false);
        const payload = typeof error === 'object' && error !== null ? error : { message: String(error || 'Error desconegut.') };
        const suffix = payload.errors && payload.errors.length ? ` ${payload.errors.slice(0, 3).join(' ')}` : '';
        showAlert((payload.message || 'No s’han pogut desar els registres.') + suffix, 'danger');
      }

      function markEditedRowsAsSaved() {
        Object.keys(state.editedRows).forEach((id) => {
          state.savedRows[id] = true;
        });

        state.editedRows = {};

        document.querySelectorAll('#rows tr').forEach((tr) => {
          tr.classList.remove('editable-row');
          const statusCell = tr.querySelector('.status-cell');
          const commentInput = tr.querySelector('.comment-input');
          const measureSelect = tr.querySelector('.measure-select');

          if (statusCell && commentInput && measureSelect && (commentInput.value.trim() || measureSelect.value.trim())) {
            const id = Object.keys(state.rowControls).find((rowId) => state.rowControls[rowId].tr === tr);
            if (id) {
              renderSavedStatus(state.rowControls[id].row, statusCell);
            }
          }
        });

        syncSaveButtonState();
      }

      function markSingleRowAsSaved(id) {
        const controls = state.rowControls[id];

        delete state.editedRows[id];

        if (controls) {
          controls.tr.classList.remove('editable-row');
          renderSavedStatus(controls.row, controls.statusCell);
        }

        syncSaveButtonState();
      }

      function clearMeetingEditState() {
        state.editedRows = {};
        state.rowControls = {};
        state.savedRows = {};
        syncSaveButtonState();
      }

      function hasUnsavedRows() {
        if (state.currentPage === 'tuesday') {
          return Object.keys(state.tuesdayComments).length > 0;
        }

        if (state.currentPage === 'third') {
          return Object.keys(state.thirdProjectOutcomes).length > 0;
        }

      function formatPoints(value) {
        const textValue = String(value === null || value === undefined || value === '' ? '0' : value).replace(',', '.');
        const numberValue = Number(textValue);

        if (!Number.isFinite(numberValue)) {
          return String(value);
        }

        return Number.isInteger(numberValue) ? String(numberValue) : numberValue.toFixed(2);
      }

      function normalizeText(value) {
        return String(value || '')
          .trim()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase();
      }

      function parseClientDate(value) {
        const match = String(value || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);

        if (!match) {
          return new Date();
        }

        return new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1]));
      }

      function formatClientDate(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');

        return `${day}/${month}/${date.getFullYear()}`;
      }

      function addClientDays(date, days) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate() + days);
      }

        const list = document.getElementById('importWarningsList');
        list.innerHTML = '';

        if (!warnings.length) {
          section.classList.add('d-none');
          return;
        }

        warnings.slice(0, 50).forEach((warning) => {
          const li = document.createElement('li');
          li.textContent = warning;
          list.appendChild(li);
        });

        if (warnings.length > 50) {
          const li = document.createElement('li');
          li.textContent = `I ${warnings.length - 50} avisos més.`;
          list.appendChild(li);
        }

        section.classList.remove('d-none');
      }
</script>
