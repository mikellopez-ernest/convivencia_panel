<script>
      const state = {
        endpoint: window.APP_ENDPOINT || 'teacher_portal',
        students: [],
        dimartsRows: [],
        projecte3rMonth: new Date().getMonth(),
        projecte3rYear: new Date().getFullYear(),
        projecte3rOutcomes: {}
      };

      const CATALAN_MONTHS = [
        'Gener',
        'Febrer',
        'Març',
        'Abril',
        'Maig',
        'Juny',
        'Juliol',
        'Agost',
        'Setembre',
        'Octubre',
        'Novembre',
        'Desembre'
      ];

      const Api = {
        call(name, args = [], options = {}) {
          const button = options.button || null;
          setLoading(options.busy !== false);

          if (button) {
            button.disabled = true;
          }

          return new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler((payload) => {
                setLoading(false);
                if (button) button.disabled = false;
                resolve(payload);
              })
              .withFailureHandler((error) => {
                setLoading(false);
                if (button) button.disabled = false;
                reject(error);
              })[name](...args);
          });
        }
      };

      document.addEventListener('DOMContentLoaded', () => {
        flatpickr('.expulsion-date', {
          dateFormat: 'd/m/Y',
          locale: flatpickr.l10ns.es,
          disableMobile: false
        });
        flatpickr('.dimarts-date', {
          dateFormat: 'd/m/Y',
          locale: flatpickr.l10ns.es,
          disableMobile: false,
          onChange: (_selectedDates, dateStr) => loadDimarts(dateStr)
        });
        document.getElementById('expulsionClass').addEventListener('change', handleClassChange);
        document.getElementById('expulsionForm').addEventListener('submit', saveExpulsion);
        document.getElementById('previousWeekButton').addEventListener('click', () => shiftDimartsWeek(-1));
        document.getElementById('nextWeekButton').addEventListener('click', () => shiftDimartsWeek(1));
        document.getElementById('saveDimartsButton').addEventListener('click', saveDimartsComments);
        document.getElementById('projecte3rPrevMonth').addEventListener('click', () => shiftProjecte3rMonth(-1));
        document.getElementById('projecte3rNextMonth').addEventListener('click', () => shiftProjecte3rMonth(1));
        document.getElementById('projecte3rMonthSelect').addEventListener('change', handleProjecte3rMonthSelect);
        document.getElementById('saveProjecte3rButton').addEventListener('click', saveProjecte3rOutcomes);
        populateProjecte3rMonthSelect();

        Api.call('getInitialPayload', [state.endpoint])
          .then(renderPayload)
          .catch(renderError);
      });

      function renderPayload(payload) {
        setLoading(false);

        if (!payload || !payload.ok) {
          renderError(payload && payload.message ? payload.message : 'Error desconegut.');
          return;
        }

        if (payload.status === 'unauthorized') {
          showAlert(payload.message || 'No tens accés a aquesta aplicació', 'warning');
          return;
        }

        if (payload.endpoint === 'expulsions_form') {
          renderExpulsionForm(payload);
          return;
        }

        if (payload.endpoint === 'dimarts') {
          renderDimarts(payload);
          return;
        }

        if (payload.endpoint === 'projecte3r') {
          renderProjecte3r(payload);
          return;
        }

        renderPortal(payload);
      }

      function renderPortal(payload) {
        document.getElementById('activeUser').textContent = payload.activeUser || '';
        document.getElementById('portalMessage').textContent = payload.message || '';
        document.getElementById('portal').classList.remove('d-none');
      }

      function renderExpulsionForm(payload) {
        document.getElementById('expulsionsFormPage').classList.remove('d-none');
        document.getElementById('expulsionData')._flatpickr.setDate(payload.values.data, false, 'd/m/Y');
        document.getElementById('expulsionStart')._flatpickr.setDate(payload.values.startDate, false, 'd/m/Y');
        document.getElementById('expulsionReturn')._flatpickr.setDate(payload.values.returnDate, false, 'd/m/Y');
        populateSelect(document.getElementById('expulsionRole'), payload.creators || [], '');
        populateSelect(document.getElementById('expulsionClass'), payload.groups || [], '');
        populateStudentSelect([]);
      }

      function handleClassChange(event) {
        const className = event.target.value;

        document.getElementById('generatedDocumentLink').classList.add('d-none');
        populateStudentSelect([]);

        if (!className) {
          return;
        }

        Api.call('getExpulsionStudentsForClass', [className])
          .then((payload) => {
            if (!payload || !payload.ok) {
              renderError(payload && payload.message ? payload.message : 'No s’ha pogut carregar l’alumnat.');
              return;
            }

            state.students = payload.students || [];
            populateStudentSelect(state.students);
          })
          .catch(renderError);
      }

      function saveExpulsion(event) {
        event.preventDefault();

        const studentSelect = document.getElementById('expulsionStudent');
        const selectedOption = studentSelect.options[studentSelect.selectedIndex];
        const payload = {
          studentId: studentSelect.value,
          student: selectedOption ? selectedOption.textContent : '',
          className: document.getElementById('expulsionClass').value,
          data: document.getElementById('expulsionData').value,
          creator: document.getElementById('expulsionCreator').value,
          role: document.getElementById('expulsionRole').value,
          startDate: document.getElementById('expulsionStart').value,
          returnDate: document.getElementById('expulsionReturn').value,
          incident: document.getElementById('expulsionIncident').value
        };
        const button = document.getElementById('saveExpulsionButton');

        Api.call('saveStandaloneExpulsion', [payload], { button })
          .then((response) => {
            if (!response || !response.ok) {
              renderError(response && response.message ? response.message : 'No s’ha pogut desar l’expulsió.');
              return;
            }

            showAlert(response.message || 'Expulsió desada.', 'success');
            const link = document.getElementById('generatedDocumentLink');
            link.href = response.documentUrl || '#';
            link.classList.toggle('d-none', !response.documentUrl);
          })
          .catch(renderError);
      }

      function renderDimarts(payload) {
        document.getElementById('dimartsPage').classList.remove('d-none');
        document.getElementById('dimartsActiveUser').textContent = payload.activeUser || '';
        document.getElementById('dimartsDate')._flatpickr.setDate(payload.selectedDate, false, 'd/m/Y');
        renderDimartsTeachers(payload.teachers || []);
        renderDimartsStudents(payload.students || []);
      }

      function loadDimarts(dateText) {
        if (!dateText) {
          return;
        }

        Api.call('getDimartsPayload', [dateText])
          .then((payload) => {
            if (!payload || !payload.ok) {
              renderError(payload && payload.message ? payload.message : 'No s’ha pogut carregar la sessió.');
              return;
            }

            renderDimarts(payload);
          })
          .catch(renderError);
      }

      function shiftDimartsWeek(direction) {
        const input = document.getElementById('dimartsDate');
        const current = input._flatpickr.selectedDates[0];

        if (!current) {
          return;
        }

        const next = new Date(current.getFullYear(), current.getMonth(), current.getDate() + (direction * 7));
        input._flatpickr.setDate(next, false);
        loadDimarts(formatDate(next));
      }

      function renderDimartsTeachers(teachers) {
        document.getElementById('dimartsTeachers').textContent = teachers.length
          ? teachers.join(', ')
          : 'No hi ha professorat assignat.';
      }

      function renderDimartsStudents(students) {
        state.dimartsRows = students;
        const body = document.getElementById('dimartsStudentsBody');
        body.innerHTML = '';

        if (!students.length) {
          const row = document.createElement('tr');
          const cell = document.createElement('td');
          cell.colSpan = 2;
          cell.className = 'text-secondary';
          cell.textContent = 'No hi ha alumnat assignat per aquesta data.';
          row.appendChild(cell);
          body.appendChild(row);
          return;
        }

        students.forEach((student) => {
          const row = document.createElement('tr');
          row.dataset.id = student.id;

          const nameCell = document.createElement('td');
          nameCell.className = 'fw-semibold';
          nameCell.textContent = student.student || '';

          const commentCell = document.createElement('td');
          const input = document.createElement('textarea');
          input.className = 'form-control dimarts-comment';
          input.rows = 2;
          input.dataset.id = student.id;
          input.value = student.comment || '';
          input.addEventListener('input', () => row.classList.add('table-warning'));
          commentCell.appendChild(input);

          row.appendChild(nameCell);
          row.appendChild(commentCell);
          body.appendChild(row);
        });
      }

      function saveDimartsComments() {
        const updates = Array.from(document.querySelectorAll('.dimarts-comment')).map((input) => ({
          id: input.dataset.id,
          comment: input.value
        }));
        const button = document.getElementById('saveDimartsButton');

        Api.call('saveDimartsComments', [updates], { button })
          .then((payload) => {
            if (!payload || !payload.ok) {
              renderError(payload && payload.message ? payload.message : 'No s’han pogut desar els comentaris.');
              return;
            }

            showAlert(payload.message || 'Comentaris desats.', 'success');
            document.getElementById('dimartsStatus').textContent = payload.savedCount + ' registre(s) desat(s).';
            document.querySelectorAll('#dimartsStudentsBody tr').forEach((row) => row.classList.remove('table-warning'));
          })
          .catch(renderError);
      }

      function populateProjecte3rMonthSelect() {
        const select = document.getElementById('projecte3rMonthSelect');
        select.innerHTML = '';

        CATALAN_MONTHS.forEach((month, index) => {
          const option = document.createElement('option');
          option.value = String(index);
          option.textContent = month;
          select.appendChild(option);
        });

        select.value = String(state.projecte3rMonth);
      }

      function handleProjecte3rMonthSelect(event) {
        state.projecte3rMonth = Number(event.target.value);
        loadProjecte3rMonth();
      }

      function shiftProjecte3rMonth(delta) {
        const next = new Date(state.projecte3rYear, state.projecte3rMonth + delta, 1);
        state.projecte3rYear = next.getFullYear();
        state.projecte3rMonth = next.getMonth();
        document.getElementById('projecte3rMonthSelect').value = String(state.projecte3rMonth);
        loadProjecte3rMonth();
      }

      function loadProjecte3rMonth() {
        Api.call('getProjecte3rPayload', [formatDate(new Date(state.projecte3rYear, state.projecte3rMonth, 1))])
          .then((payload) => {
            if (!payload || !payload.ok) {
              renderError(payload && payload.message ? payload.message : 'No s’ha pogut carregar el calendari 3R.');
              return;
            }

            renderProjecte3r(payload);
          })
          .catch(renderError);
      }

      function renderProjecte3r(payload) {
        document.getElementById('projecte3rPage').classList.remove('d-none');
        document.getElementById('projecte3rActiveUser').textContent = payload.activeUser || '';

        if (Number.isInteger(payload.month)) {
          state.projecte3rMonth = payload.month;
          document.getElementById('projecte3rMonthSelect').value = String(payload.month);
        }

        if (Number.isInteger(payload.year)) {
          state.projecte3rYear = payload.year;
        }

        state.projecte3rOutcomes = {};
        document.getElementById('projecte3rMonthLabel').textContent = `${CATALAN_MONTHS[state.projecte3rMonth]} ${state.projecte3rYear}`;

        const body = document.getElementById('projecte3rRows');
        const empty = document.getElementById('projecte3rEmpty');
        const options = payload.outcomeOptions || [];
        let assignmentCount = 0;
        body.innerHTML = '';

        (payload.weeks || []).forEach((week) => {
          const row = document.createElement('tr');

          week.forEach((cell) => {
            const td = document.createElement('td');
            td.className = 'projecte3r-cell';
            td.classList.toggle('projecte3r-cell-muted', !cell.inMonth);

            const date = document.createElement('div');
            date.className = 'fw-semibold';
            date.textContent = cell.inMonth ? cell.date : '';
            td.appendChild(date);

            if (cell.inMonth) {
              const teacher = document.createElement('div');
              teacher.className = 'small text-secondary mb-2';
              teacher.textContent = cell.teacher || 'Sense professor';
              td.appendChild(teacher);

              (cell.assignments || []).forEach((assignment) => {
                assignmentCount += 1;
                const block = document.createElement('div');
                const name = document.createElement('div');
                const select = document.createElement('select');

                block.className = 'projecte3r-assignment';
                name.className = 'small mb-1';
                name.textContent = assignment.student || '(sense alumne)';
                select.className = 'form-select form-select-sm';
                populateSelect(select, options, '');
                select.value = assignment.aprofitament || '';
                select.addEventListener('change', () => {
                  state.projecte3rOutcomes[assignment.id] = {
                    id: assignment.id,
                    aprofitament: select.value
                  };
                  block.classList.add('projecte3r-assignment-edited');
                });

                block.appendChild(name);
                block.appendChild(select);
                td.appendChild(block);
              });
            }

            row.appendChild(td);
          });

          body.appendChild(row);
        });

        empty.classList.toggle('d-none', assignmentCount > 0);
        empty.textContent = 'No hi ha assignacions 3R en aquest mes.';
        document.getElementById('projecte3rStatus').textContent = '';
      }

      function saveProjecte3rOutcomes() {
        const updates = Object.keys(state.projecte3rOutcomes).map((id) => state.projecte3rOutcomes[id]);
        const button = document.getElementById('saveProjecte3rButton');

        Api.call('saveProjecte3rOutcomes', [updates], { button })
          .then((payload) => {
            if (!payload || !payload.ok) {
              renderError(payload && payload.message ? payload.message : 'No s’ha pogut desar el projecte 3R.');
              return;
            }

            showAlert(payload.message || 'Aprofitament desat.', 'success');
            document.getElementById('projecte3rStatus').textContent = payload.savedCount + ' registre(s) desat(s).';
            state.projecte3rOutcomes = {};
            document.querySelectorAll('.projecte3r-assignment-edited').forEach((block) => {
              block.classList.remove('projecte3r-assignment-edited');
            });
          })
          .catch(renderError);
      }

      function populateSelect(select, values, emptyLabel) {
        select.innerHTML = '';
        const empty = document.createElement('option');
        empty.value = '';
        empty.textContent = emptyLabel || 'Selecciona...';
        select.appendChild(empty);

        values.forEach((value) => {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = value;
          select.appendChild(option);
        });
      }

      function populateStudentSelect(students) {
        const select = document.getElementById('expulsionStudent');
        select.innerHTML = '';
        const empty = document.createElement('option');
        empty.value = '';
        empty.textContent = students.length ? 'Selecciona...' : 'Selecciona primer una classe';
        select.appendChild(empty);

        students.forEach((student) => {
          const option = document.createElement('option');
          option.value = student.studentId;
          option.textContent = student.studentName;
          select.appendChild(option);
        });

        select.disabled = !students.length;
      }

      function renderError(error) {
        setLoading(false);
        showAlert(error.message || String(error), 'danger');
      }

      function showAlert(message, type) {
        const alert = document.getElementById('alert');
        alert.className = `alert alert-${type}`;
        alert.textContent = message;
      }

      function setLoading(isLoading) {
        document.getElementById('busyOverlay').classList.toggle('active', Boolean(isLoading));
      }

      function formatDate(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        return `${day}/${month}/${date.getFullYear()}`;
      }
</script>
